# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── SETUP ──────────────────────────────────────────────────────────────────
#
# Using Option A (OIDC Trusted Publishing) — configured on npmjs.com under
# package settings -> Publish access -> Trusted Publishers, pointing at this
# repo + this workflow file. No npm token is used or needed: the id-token
# permission below lets npm CLI mint a short-lived OIDC-backed publish token
# automatically. This also sidesteps npm's 2FA-bypass-token restrictions and
# the EOTP errors a classic/automation token hit here previously.
#
# ─── TAG CONVENTION ─────────────────────────────────────────────────────────
#
# Triggers on tags matching "*.*.*" (e.g. 0.2.0) — this is a single-package
# repo, so no name prefix is needed (unlike the jitterflow-core-app monorepo
# this package was split out of, which used `n8n-nodes-jitterflow@*` to
# disambiguate from other packages' tags).
#
# ─── RELEASE PROCESS ────────────────────────────────────────────────────────
#
# Run locally to start an interactive release:
#
#   npm run release
#
# Lints, builds, prompts for a version bump, updates the changelog, commits,
# tags, and pushes — which triggers this workflow to publish to npm.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          # Required for OIDC Trusted Publishing — without an explicit
          # registry-url, npm CLI can't resolve which registry to request
          # the OIDC token exchange against and silently falls back to
          # classic (empty) auth, failing with ENEEDAUTH.
          registry-url: 'https://registry.npmjs.org'

      # See ci.yml for why this is npm install rather than npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Release
        run: npm run release
