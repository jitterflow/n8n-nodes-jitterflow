name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # npm ci here would enforce an exact lockfile match, but this repo's
      # devDependency graph (via @n8n/node-cli -> eslint tooling ->
      # @langchain/community's huge optional-platform-binary tree, e.g.
      # @unrs/resolver-binding-wasm32-wasi's nested @emnapi/* packages)
      # hits a real npm arborist bug where `npm install` never converges to
      # a lockfile that its own `npm ci` accepts — confirmed by repeatedly
      # regenerating package-lock.json from scratch and seeing a different
      # mismatch each time. None of this affects the published package,
      # which ships zero runtime dependencies (peer-only, per n8n's
      # convention) — it's dev/lint/build tooling only.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test
